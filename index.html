*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8cb7ff;outline-offset:3px}.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.side{background:#111b30;color:#e5edff;padding:32px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:4px 9px 35px}.mark{background:#3b65ec;color:white;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;font-size:26px;font-weight:900}.brand strong{letter-spacing:.06em;font-size:15px}.brand small{display:block;font-size:9px;letter-spacing:.21em;color:#8292b6}.sidetitle{color:#8391b0;font-size:10px;letter-spacing:.16em;font-weight:800;padding:18px 14px 10px}.nav{display:flex;gap:12px;align-items:center;width:100%;border-radius:11px;padding:11px 14px;color:#a8b8d5;font-size:13px;border:0;background:transparent;text-align:left}.nav:hover,.nav.active{background:#24375b;color:#fff}.nav span:first-child{width:18px;font-size:18px;text-align:center}.sidefoot{margin-top:auto;border:1px solid #344560;border-radius:15px;padding:18px;color:#a7b9d5;font-size:12px}.sidefoot b{color:white;font-size:14px;display:block;margin-bottom:6px}.main{min-width:0}.top{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 clamp(22px,5vw,66px)}.crumb{color:var(--muted);font-size:11px;letter-spacing:.09em;font-weight:750}.crumb b{color:var(--text)}.topright{display:flex;gap:15px;align-items:center}.status{color:#3a9e88;font-weight:700;font-size:11px}.status:before{content:"";display:inline-block;background:#22bc91;width:7px;height:7px;border-radius:50%;margin-right:8px}.iconbtn{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:11px;min-width:34px;height:34px;padding:0 9px}.content{max-width:1280px;margin:0 auto;padding:38px clamp(20px,5vw,66px) 70px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--blue);font-size:11px;font-weight:800}.hero{background:linear-gradient(119deg,#142747 3%,#102041 65%,#114b63);color:white;padding:clamp(27px,4vw,50px);border-radius:22px;position:relative;overflow:hidden}.hero:after{content:"✳";color:#ffffff08;font-size:260px;position:absolute;right:-30px;top:-105px;pointer-events:none}.hero .eyebrow{color:#91baff}.hero h1{font-size:clamp(28px,3.8vw,47px);line-height:1.25;letter-spacing:-.035em;margin:14px 0;position:relative;z-index:1}.hero p{color:#b7cce5;max-width:670px;margin:0;font-size:14px;position:relative;z-index:1}.hero-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1}.hero-meta span{background:#ffffff18;border:1px solid #ffffff17;padding:7px 12px;font-size:11px;border-radius:999px;color:#dbe9f9}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0 34px}.kpi{background:var(--panel);padding:20px 24px;border-radius:15px;border:1px solid var(--line)}.kpi strong{font-size:30px;line-height:1.2;display:block}.kpi small{color:var(--muted);font-size:12px}.sectionline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 16px}.sectionline h2{margin:0;font-size:21px;letter-spacing:-.025em}.sectionline small{color:var(--muted)}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:thin}.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:9px 15px;white-space:nowrap;font-size:12px}.pill.active,.pill:hover{background:var(--dark);color:#fff;border-color:var(--dark)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.paper{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}.paper:hover{transform:translateY(-3px);box-shadow:0 18px 45px #182d461a}.paper-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{display:inline-flex;background:var(--soft);color:var(--blue);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:750}.subtle{color:var(--muted);font-size:11px}.paper h3{font-size:18px;line-height:1.48;margin:18px 0 9px}.paper p{font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 16px}.paper-meta{padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}.paper-meta .more{color:var(--blue);font-weight:750}.empty{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:50px 26px;text-align:center;grid-column:1/-1}.empty-icon{font-size:38px;margin-bottom:8px;color:#8ca7db}.empty h3{margin:5px 0 8px}.empty p{color:var(--muted);max-width:510px;margin:0 auto;font-size:13px}.info{margin-top:30px;background:#eaf1ff;border:1px solid #dae6ff;border-radius:16px;padding:20px 24px;color:#385484;font-size:13px}.info strong{display:block;color:#193c79;margin-bottom:3px}.foot{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding:22px clamp(20px,5vw,66px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.page-title h1{font-size:clamp(26px,3.5vw,38px);margin:8px 0 4px;line-height:1.3}.page-title p{color:var(--muted);font-size:13px}.searchbar{display:flex;gap:12px;margin:24px 0}.searchbar input{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 17px;flex:1;min-width:0;color:var(--text)}.searchbar button,.action{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:12px 20px;display:inline-block}.detail{max-width:850px;margin:auto}.detail-head{background:var(--panel);border:1px solid var(--line);padding:32px;border-radius:18px}.detail-head h1{font-size:clamp(24px,3vw,36px);line-height:1.4}.detail-head .english{color:var(--muted);font-size:13px}.detail-section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:25px 28px;margin-top:16px}.detail-section h2{font-size:19px;margin:0 0 14px}.detail-section p,.detail-section li{font-size:14px;line-height:2;white-space:pre-line}.detail-section ul{padding-left:20px}.evidence{font-size:12px;color:var(--muted);margin-top:10px;word-break:break-all}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.links a{color:var(--blue);font-size:13px;border:1px solid var(--line);padding:7px 12px;border-radius:9px}.archives{display:grid;gap:12px}.archive{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center}.notice{padding:12px 16px;border-radius:12px;background:#fff6e8;border:1px solid #f7dfb0;color:#815e20;font-size:12px;margin-bottom:20px}.mobile-nav{display:none}.loading{color:var(--muted);text-align:center;padding:45px}.bullet{padding-left:20px}.bullet li{margin:7px 0}

@media(max-width:980px){.shell{grid-template-columns:210px minmax(0,1fr)}.side{padding:24px 12px}.cards{grid-template-columns:1fr}.content{padding:26px 24px 60px}}@media(max-width:700px){.shell{display:block}.side{display:none}.top{padding:0 18px;height:58px}.crumb{font-size:10px;letter-spacing:0}.status{display:none}.content{padding:20px 16px 90px}.hero{border-radius:17px;padding:27px 23px}.hero h1{font-size:30px}.hero:after{font-size:175px;top:-55px;right:-23px}.hero-meta{margin-top:22px}.kpis{gap:9px;margin:13px 0 26px}.kpi{padding:14px 12px}.kpi strong{font-size:24px}.kpi small{font-size:10px}.sectionline h2{font-size:18px}.paper{padding:20px}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:40}.mobile-nav a{display:grid;text-align:center;gap:2px;color:var(--muted);font-size:21px;min-width:50px}.mobile-nav a span{font-size:10px}.mobile-nav a.active{color:var(--blue)}.foot{padding-bottom:82px}.detail-head,.detail-section{padding:22px}.detail-head h1{font-size:25px}.searchbar{flex-direction:column}.searchbar button{width:100%}}@media(min-width:1200px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

<div class="shell"><aside class="side"><a class="brand" href="#/"><span class="mark">✳</span><span><strong>MULTIMODAL.</strong><small>RESEARCH DAILY</small></span></a><div class="sidetitle">WORKSPACE</div><nav id="desktop-nav"><a class="nav active" href="#/"><span>⌂</span>研究日报</a><a class="nav" href="#/archive"><span>▦</span>历史归档</a><a class="nav" href="#/search"><span>⌕</span>论文搜索</a></nav><div class="sidetitle">RESEARCH AREAS</div><nav id="category-nav"></nav><div class="sidefoot"><b>✧ 让研究始终领先一步</b>跟踪多模态模型、特征表示与数据集的真实进展。<br><br>更新目标：北京时间每天 08:00</div></aside>
<div class="main"><header class="top"><div class="crumb">RESEARCH INTELLIGENCE&nbsp; / &nbsp;<b id="crumb">每日精选</b></div><div class="topright"><span class="status">公开科研站</span><a class="iconbtn" href="#/search" aria-label="搜索">⌕</a><button class="iconbtn" id="theme" aria-label="切换深色模式">☾</button></div></header><main id="app" class="content"><div class="loading">正在读取科研日报...</div></main><footer class="foot"><span>© 2026 MULTIMODAL RESEARCH DAILY</span><span>AI 辅助科研分析，请以原始论文为准</span><a href="#/about">数据规则与说明 ↗</a></footer></div></div>

<script>
"use strict";
const MODULES={model_architecture:"模型架构",feature_representation:"特征表示",feature_extraction:"特征提取",cross_modal_alignment:"跨模态对齐",feature_fusion:"特征融合",data:"数据与基准",training_optimization:"训练优化",reasoning_decision:"推理决策",system_reliability:"系统可靠性"};
const state={papers:[],issues:[],query:"",filter:"all",loaded:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const txt=(o,key,d="")=>o&&o[key]!=null?o[key]:d;
const date=s=>s?esc(s):"未标注";
const title=p=>txt(p.metadata,"title_zh",txt(p.metadata,"title_en","未命名论文"));
const moduleName=p=>MODULES[txt(p.classification,"primary_module")]||"多模态研究";
const paperUrl=p=>"#/papers/"+encodeURIComponent(p.paper_id);
const summary=p=>txt(p.analysis,"one_line_innovation",txt(p.display,"teaser","暂无摘要"));
const dateStr=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const latest=()=>state.issues.find(i=>["ready","published","empty"].includes(i.status));
const issuePapers=i=>(i?.paper_ids||[]).map(id=>state.papers.find(p=>p.paper_id===id)).filter(Boolean);
function card(p){return '<article class="paper"><div class="paper-top"><span class="tag">'+esc(moduleName(p))+'</span><span class="subtle">'+date(txt(p.metadata,"first_public_date"))+'</span></div><h3><a href="'+paperUrl(p)+'">'+esc(title(p))+'</a></h3><p>'+esc(summary(p))+'</p><div class="paper-meta"><span>'+esc(txt(p.metadata,"publication_status","preprint"))+' · '+esc((p.classification?.modalities||[]).slice(0,2).join(" / "))+'</span><a class="more" href="'+paperUrl(p)+'">深度解析 ↗</a></div></article>'}
function cards(papers){return papers.length?'<div class="cards">'+papers.map(card).join("")+'</div>':'<div class="cards"><div class="empty"><div class="empty-icon">✧</div><h3>暂无审核通过的论文</h3><p>研究日报只发布经过来源及技术核验的真实论文。你可以稍后回来查看；我们不会用虚构结果凑满五篇。</p></div></div>'}
function issueTitle(i){return i?.daily_summary?.title||"多模态前沿科研日报"}
function home(i){let ps=issuePapers(i),dates=i?.issue_date||dateStr(),summary=i?.daily_summary||{};return '<section class="hero"><div class="eyebrow">MULTIMODAL RESEARCH INTELLIGENCE</div><h1>每天5篇，读懂<br>多模态最新创新</h1><p>关注模型架构、特征表示、跨模态融合和公开数据集。每篇深入分析研究问题、方法变化、实验依据和舰船识别迁移启发。</p><div class="hero-meta"><span>◷ 北京时间 08:00 更新目标</span><span>▤ 最多5篇 / 每日</span><span>✧ 公开科研资料</span></div></section><div class="kpis"><div class="kpi"><strong>'+ps.length+'</strong><small>本期审核论文</small></div><div class="kpi"><strong>'+state.papers.length+'</strong><small>累计论文</small></div><div class="kpi"><strong>'+state.issues.length+'</strong><small>历史日报</small></div></div><div class="sectionline"><h2>'+esc(i?"当期论文精选":"最新科研论文")+'</h2><small>'+date(dates)+'</small></div><div class="filters" id="filters"><button class="pill active" data-filter="all">全部论文</button>'+Object.entries(MODULES).map(([id,n])=>'<button class="pill" data-filter="'+id+'">'+n+'</button>').join("")+'</div><div id="paper-list">'+cards(ps)+'</div>'+(summary.trends?.length?'<div class="sectionline"><h2>今日技术趋势</h2></div><div class="detail-section"><ul class="bullet">'+summary.trends.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>':'')+'<div class="info"><strong>数据质量声明</strong>论文内容由自动化流程辅助整理，仅经来源与技术审核的研究才能发布。首版部署后如尚未配置 AI API 密钥，网站将展示空状态，不会伪造日报。</div>'}
function section(t,body){return '<section class="detail-section"><h2>'+t+'</h2>'+body+'</section>'}
function para(x){return '<p>'+esc(x||"暂无经核验的信息")+'</p>'}
function bullets(items,fn){items=Array.isArray(items)?items:(items==null||items===""?[]:[items]);return items.length?'<ul class="bullet">'+items.map(x=>'<li>'+(fn?fn(x):esc(x))+'</li>').join("")+'</ul>':para("暂无经核验的信息")}
function detail(p){let a=p.analysis||{},m=p.metadata||{},e=p.evidence||[];const changes=a.technical_changes||[],steps=a.architecture_steps||[];let out='<div class="detail"><div class="detail-head"><a class="subtle" href="#/">← 返回日报</a><div class="links"><span class="tag">'+esc(moduleName(p))+'</span><span class="subtle">'+date(m.first_public_date)+'</span></div><h1>'+esc(title(p))+'</h1><p class="english">'+esc(m.title_en||"")+'</p><p class="subtle">'+esc((m.authors||[]).join(" · "))+'</p><div class="links">'+(m.paper_url?'<a href="'+esc(m.paper_url)+'" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>':'')+(m.code_url?'<a href="'+esc(m.code_url)+'" target="_blank" rel="noopener noreferrer">开源代码 ↗</a>':'')+(m.dataset_url?'<a href="'+esc(m.dataset_url)+'" target="_blank" rel="noopener noreferrer">数据集 ↗</a>':'')+'<button class="iconbtn" id="share" type="button">分享本篇</button></div></div>';
out+=section("一句话核心创新",para(a.one_line_innovation));
out+=section("01 · 解决什么研究问题？",para(a.research_problem)+para(a.traditional_approach)+para(a.traditional_limitations));
out+=section("02 · 核心方法与数据流",para(a.method_overview)+bullets(steps,x=>'<b>'+esc(x.module||"处理模块")+'</b>：'+esc(x.input||"")+' → '+esc(x.operation||"")+' → '+esc(x.output||"")));
out+=section("03 · 相比传统方法的改进",bullets(changes,x=>'<b>原有机制：</b>'+esc(x.before||"")+'<br><b>论文改进：</b>'+esc(x.change||"")+'<br><b>技术原因：</b>'+esc(x.rationale||"")+'<br><b>预期或验证作用：</b>'+esc(x.benefit||"")));
out+=section("04 · 实验结果与证据",bullets(a.experiments,x=>'<b>'+esc(x.dataset||"")+' / '+esc(x.metric||"")+'</b>：'+esc(x.baseline||"")+' '+esc(x.baseline_value||"")+' → '+esc(x.proposed_value||"")+'。'+esc(x.conclusion||"")));
out+=section("05 · 方法局限性",bullets(a.limitations,x=>esc(x.description||"")+' <span class="subtle">('+esc(x.basis==="author_reported"?"作者报告":"分析推断")+')</span>'));
let ship=a.ship_transfer||{};out+=section("06 · 对舰船识别的研究启发",'<p><b>迁移相关性：</b>'+esc(ship.relevance||"uncertain")+'</p>'+bullets(ship.adaptations)+bullets(ship.research_hypotheses));
out+=section("07 · 后续研究问题",bullets(a.open_questions));
out+=section("论文来源与审核说明",para("论文状态："+(m.publication_status||"未核实")+(m.venue?" · "+m.venue:""))+'<p class="subtle">本页为 AI 辅助技术解读，方法细节和实验结果请以原论文为准。</p>'+bullets(e.slice(0,12),x=>'<a target="_blank" rel="noopener noreferrer" href="'+esc(x.url||"#")+'">'+esc(x.locator||x.source_type||"来源")+'</a>'));
return out+'</div>'}
function search(){return '<div class="page-title"><span class="eyebrow">PAPER DISCOVERY</span><h1>论文检索</h1><p>根据标题、关键词、研究模块和摘要查找已发布论文。</p></div><form class="searchbar" id="search-form"><input id="query" placeholder="输入论文名称、模型、融合、特征等关键词" value="'+esc(state.query)+'" aria-label="搜索论文"><button>搜索</button></form><div id="search-results"></div>'}
function searchResults(){let q=state.query.toLocaleLowerCase().trim(),ps=state.papers.filter(p=>!q||JSON.stringify([p.metadata?.title_zh,p.metadata?.title_en,p.display?.teaser,p.classification?.keywords,MODULES[p.classification?.primary_module]]).toLocaleLowerCase().includes(q));return '<div class="sectionline"><h2>搜索结果</h2><small>'+ps.length+' 篇</small></div>'+cards(ps)}
function archive(){return '<div class="page-title"><span class="eyebrow">RESEARCH ARCHIVE</span><h1>历史日报</h1><p>按日期浏览每天的研究结果。历史论文永久保留，论文修订版不会重复占位。</p></div><div class="archives">'+(state.issues.length?state.issues.map(i=>'<a class="archive" href="#/daily/'+esc(i.issue_date)+'"><span><b>'+esc(i.issue_date)+'</b><br><span class="subtle">'+esc(i.daily_summary?.title||"多模态科研日报")+'</span></span><span class="tag">'+i.paper_ids.length+' 篇 ↗</span></a>').join(""):'<div class="empty"><h3>暂无历史日报</h3><p>正式论文数据采集并通过审核后，日报将按日期归档。</p></div>')+'</div>'}
function about(){return '<div class="page-title"><span class="eyebrow">ABOUT THE PROJECT</span><h1>关于 MultiModal Research Daily</h1><p>一个公开、移动端优先的多模态科研信息站。</p></div>'+section("研究范围",para("重点追踪模型架构、特征表示、跨模态对齐与融合、新公开数据集、鲁棒性及推理能力。广泛关注多模态前沿，并分析其在舰船识别中的潜在应用。"))+section("更新规则",para("目标为北京时间每日08:00触发，单日最多推荐5篇论文。自动化任务运行或外部来源可能延迟；仅发布核验通过的论文，不足5篇也不凑数。"))+section("事实与引用",para("区分预印本和正式发表，去重论文版本，优先提供原始论文与实验依据。AI 生成的分析不等于同行评审，研究引用请以原文为准。"))+section("联系我们",para("此项目由公开 GitHub 仓库维护，欢迎分享和反馈。"))}
function render(){let path=decodeURIComponent(location.hash.slice(1)||"/"),parts=path.replace(/^\/+/,"").split("/").filter(Boolean),page=parts[0]||"home",app=$("#app"),content="";window.scrollTo(0,0);document.title="MultiModal Research Daily · 多模态前沿科研日报";if(page==="home"){content=home(latest())}else if(page==="daily"){let i=state.issues.find(x=>x.issue_date===parts[1]);content=i?home(i):'<div class="empty">找不到该期日报</div>'}else if(page==="archive"){content=archive()}else if(page==="search"){content=search()}else if(page==="topics"){let m=parts[1],ps=state.papers.filter(p=>p.classification?.primary_module===m||(p.classification?.secondary_modules||[]).includes(m));content='<div class="page-title"><span class="eyebrow">RESEARCH TOPICS</span><h1>'+esc(MODULES[m]||"分类论文")+'</h1><p>该方向已审核通过的科研论文</p></div>'+cards(ps)}else if(page==="papers"){let p=state.papers.find(x=>x.paper_id===parts[1]);content=p?detail(p):'<div class="empty">未找到论文</div>'}else if(page==="about"){content=about()}else{content=home(latest())}app.innerHTML=content;$("#crumb").textContent=({home:"每日精选",daily:"历史日报",archive:"历史归档",search:"论文搜索",topics:"研究专题",papers:"论文解读",about:"关于平台"})[page]||"每日精选";document.querySelectorAll(".nav,.mobile-nav a").forEach(a=>{a.classList.toggle("active",a.getAttribute("href")===(page==="home"?"#/":"#/"+page))});if(page==="home"||page==="daily"){document.querySelectorAll("[data-filter]").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===btn));$("#paper-list").innerHTML=cards(issuePapers(page==="daily"?state.issues.find(x=>x.issue_date===parts[1]):latest()).filter(p=>btn.dataset.filter==="all"||p.classification?.primary_module===btn.dataset.filter||(p.classification?.secondary_modules||[]).includes(btn.dataset.filter)))}))}if(page==="search"){const form=$("#search-form");form.addEventListener("submit",ev=>{ev.preventDefault();state.query=$("#query").value;$("#search-results").innerHTML=searchResults()});$("#search-results").innerHTML=searchResults()}if(page==="papers"&&$("#share"))$("#share").addEventListener("click",async()=>{try{if(navigator.share){await navigator.share({title:document.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);alert("链接已复制")}}catch(e){}})}
function initNav(){ $("#category-nav").innerHTML=Object.entries(MODULES).map(([id,n],i)=>'<a class="nav" href="#/topics/'+id+'"><span style="color:#87a4ff">●</span>'+esc(n)+'</a>').join("") }
async function load(){try{const res=await fetch("./data/content.json",{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);const data=await res.json();state.papers=Array.isArray(data.papers)?data.papers.filter(p=>p.review?.review_status==="approved"):[];let valid=new Set(state.papers.map(p=>p.paper_id));state.issues=Array.isArray(data.issues)?data.issues.filter(i=>Array.isArray(i.paper_ids)&&i.paper_ids.every(id=>valid.has(id))&&["ready","published","empty"].includes(i.status)).sort((a,b)=>b.issue_date.localeCompare(a.issue_date)):[]}catch(e){console.warn("读取论文数据失败",e)}state.loaded=true;initNav();render()}
$("#theme").addEventListener("click",()=>{document.body.classList.toggle("dark");let isDark=document.body.classList.contains("dark");localStorage.setItem("mmrd-theme",isDark?"dark":"light");$("#theme").textContent=isDark?"☀":"☾"});if(localStorage.getItem("mmrd-theme")==="dark"){document.body.classList.add("dark");$("#theme").textContent="☀"}window.addEventListener("hashchange",()=>state.loaded&&render());load();
</script>
</body></html>
